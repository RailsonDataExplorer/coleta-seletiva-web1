spring:
  application:
    name: coleta-seletiva
  profiles:
    active: local # Usa o perfil local por padrão

  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/${DB_NAME:coletaseletiva}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:admin123} # Em produção, isso virá de uma variável de ambiente
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8080}