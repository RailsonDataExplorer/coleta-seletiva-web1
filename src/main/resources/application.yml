spring:
  application:
    name: coleta-seletiva
  datasource:
    url: jdbc:postgresql://localhost:5434/coletaseletiva
    username: postgres
    password: postgres123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  info:
    title: API Coleta Seletiva
    description: API REST para gerenciamento de solicitações de coleta seletiva
    version: 1.0.0
    contact:
      name: Railson
      email: railson@email.com