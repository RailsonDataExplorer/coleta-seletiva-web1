spring:
  application:
    name: coleta-seletiva
  datasource:
    url: jdbc:postgresql://localhost:5434/coletaseletiva
    username: postgres
    password: postgres123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

server:
  port: 8080