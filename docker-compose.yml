services:
  postgres-coleta:
    image: postgres:16
    container_name: coleta-seletiva-db
    environment:
      POSTGRES_DB: coletaseletiva
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: